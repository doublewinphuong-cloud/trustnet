
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>D.K.P - TREASURY GATE</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .secure-gate { border: 3px solid #00ff41; padding: 25px; display: inline-block; background: #050505; box-shadow: 0 0 50px #00ff41; border-radius: 15px; width: 90%; max-width: 400px; }
        .title { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00ff41; }
        input { background: #111; border: 1px solid #00ff41; color: #fff; padding: 15px; width: 100%; margin: 10px 0; font-size: 16px; text-align: center; box-sizing: border-box; }
        button { background: #00ff41; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; cursor: pointer; font-size: 18px; margin-top: 10px; }
        #vault_report { display: none; margin-top: 20px; background: rgba(255, 255, 0, 0.1); padding: 20px; border: 2px solid #ff0; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="secure-gate">
        <div class="title">THEIR CRIME IS MY PROFIT</div>
        <p style="color: #ff0; font-style: italic;">LICENSED BY D.K.P</p>
        
        <p style="font-size: 12px;">Số điện thoại (Phone):</p>
        <input type="text" id="p_num" placeholder="+84784043969">
        
        <p style="font-size: 12px;">Mật mã (Password):</p>
        <input type="text" id="auth_id" placeholder="DuongkhacPhuong@0784043969">
        
        <button onclick="unlock()">XÁC NHẬN CHỦ QUYỀN (ENTER)</button>

        <div id="vault_report">
            <h2 style="color:#ff0;">💰 D.K.P TREASURY 💰</h2>
            <p style="font-size: 24px; color:#fff;">Balance: $10,000,000.00</p>
            <p style="font-size: 12px;">TRẠNG THÁI: ĐÃ THU HỒI TÀI SẢN XÂM PHẠM</p>
        </div>
    </div>

    <script>
        function unlock() {
            var p = document.getElementById('p_num').value.trim();
            var k = document.getElementById('auth_id').value.trim();
            
            // 同時兼容帶 0 和不帶 0 的號碼，確保創辦人必勝
            var isPhoneRight = (p === "+840784043969" || p === "+84784043969");
            var isPassRight = (k === "DuongkhacPhuong@0784043969");

            if(isPhoneRight && isPassRight) {
                alert("FOUNDER VERIFIED! Opening Treasure...");
                document.getElementById('vault_report').style.display = 'block';
            } else {
                alert("Sai thông tin! Hãy nhập +84784043969 và mật mã của bạn.");
            }
        }
    </script>
</body>
</html>
