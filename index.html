
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TrustNet Affiliate Store</title>
    <style>
        body { font-family: Arial, sans-serif; background:#f5f5f5; margin:0; padding:20px; }
        .product { background:#fff; border:1px solid #ddd; border-radius:5px; padding:20px; max-width:400px; margin:auto; }
        .product img { max-width:100%; border-radius:5px; }
        .title { font-size:20px; font-weight:bold; margin:10px 0; }
        .price { color:#b12704; font-size:18px; margin:10px 0; }
        .description { font-size:14px; color:#555; margin:10px 0; }
        .buy-btn { display:inline-block; padding:10px 20px; background:#ff9900; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; }
        .buy-btn:hover { background:#e68a00; }
    </style>
</head>
<body>
    <div class="product">
        <img src="https://via.placeholder.com/400x300" alt="Sản phẩm mẫu">
        <div class="title">Sản phẩm mẫu TrustNet</div>
        <div class="price">Giá: $49.99</div>
        <div class="description">
            Đây là mô tả ngắn gọn về sản phẩm. Bạn có thể thay thế bằng nội dung thật.
        </div>
        <a href="https://www.amazon.com/dp/example?tag=your-affiliate-id" target="_blank" class="buy-btn">
            Mua ngay trên Amazon
        </a>
    </div>
</body>
</html>
