
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>trustNet v1.0 单页版</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
    nav { background: #3498db; padding: 10px; text-align: center; }
    nav a { color: white; margin: 0 15px; text-decoration: none; font-weight: bold; cursor: pointer; }
    nav a:hover { text-decoration: underline; }
    section { display: none; padding: 50px; text-align: center; }
    section.active { display: block; }
    h1 { color: #2c3e50; }
    p { color: #16a085; }
  </style>
</head>
<body>
  <!-- 导航栏 -->
  <nav>
    <a onclick="showSection('home')">首页</a>
    <a onclick="showSection('about')">关于我们</a>
    <a onclick="showSection('contact')">联系我们</a>
  </nav>

  <!-- 首页 -->
  <section id="home" class="active">
    <h1>欢迎来到 trustNet v1.0</h1>
    <p>这是网站的首页。</p>
  </section>

  <!-- 关于页 -->
  <section id="about">
    <h1>关于我们</h1>
    <p>这里是关于 trustNet v1.0 的介绍。</p>
  </section>

  <!-- 联系页 -->
  <section id="contact">
    <h1>联系我们</h1>
    <p>邮箱：example@example.com</p>
    <p>电话：+84-123-456-789</p>
  </section>

  <script>
    function showSection(id) {
      document.querySelectorAll('section').forEach(sec => sec.classList.remove('active'));
      document.getElementById(id).classList.add('active');
    }
  </script>
</body>
</html>
