
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phaeton-SHMS System</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f7f7f7; margin: 0; }
        .container { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; width: 90%; max-width: 350px; }
        input { padding: 12px; width: 100%; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 5px; font-size: 16px; box-sizing: border-box; }
        .show-pw { font-size: 12px; color: #007bff; cursor: pointer; margin-bottom: 15px; display: block; text-align: right; }
        button { padding: 12px; width: 100%; background-color: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        .footer { margin-top: 25px; font-size: 11px; color: #aaa; }
    </style>
</head>
<body>
<div class="container">
    <h2>Hệ thống Phaeton-SHMS</h2>
    <p>Vui lòng nhập mã xác thực.</p>
    <input type="password" id="authCode" placeholder="Nhập phím...">
    <span class="show-pw" onclick="toggleView()">Hiển thị mật khẩu (顯示字體)</span>
    <button onclick="verify()">Xác minh danh tính</button>
    <div class="footer">Copyright © Dươngkhắcphương@0784043969</div>
</div>
<script>
    function toggleView() {
        var x = document.getElementById("authCode");
        x.type = (x.type === "password") ? "text" : "password";
    }
    function verify() {
        const key = document.getElementById('authCode').value;
        if (key === 'Dươngkhắcphương@0784043969') {
            alert('Identity Verified. Accessing Advanced Electrical Energy Technology...');
            window.location.href = "https://github.com/doublewinphuong-cloud/trustnet";
        } else {
            alert('PROHIBITED: Unauthorized Access.');
        }
    }
</script>
</body>
</html>
