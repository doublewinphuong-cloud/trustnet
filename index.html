
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>TrustNet Affiliate Mall</title>
    <style>
        body { font-family: Arial, sans-serif; margin:0; background:#f5f5f5; }
        header { background:#232f3e; color:#fff; padding:15px; display:flex; justify-content:space-between; align-items:center; }
        header h1 { margin:0; font-size:22px; }
        nav a { color:#fff; margin:0 10px; text-decoration:none; }
        nav a:hover { text-decoration:underline; }
        .search-bar { margin:20px auto; text-align:center; }
        .search-bar input { width:300px; padding:8px; }
        .search-bar button { padding:8px 15px; background:#ff9900; border:none; color:#fff; font-weight:bold; cursor:pointer; }
        .store { display:flex; flex-wrap:wrap; gap:20px; justify-content:center; padding:20px; }
        .product { background:#fff; border:1px solid #ddd; border-radius:5px; padding:15px; width:220px; }
        .product img { max-width:100%; border-radius:5px; }
        .title { font-size:16px; font-weight:bold; margin:10px 0; }
        .price { color:#b12704; font-size:14px; margin:10px 0; }
        .description { font-size:13px; color:#555; margin:10px 0; }
        .buy-btn { display:inline-block; padding:8px 15px; background:#ff9900; color:#fff; text-decoration:none; border-radius:5px; font-weight:bold; }
        .buy-btn:hover { background:#e68a00; }
        footer { background:#232f3e; color:#fff; text-align:center; padding:15px; margin-top:20px; }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <header>
        <h1>TrustNet Mall</h1>
        <nav>
            <a href="#">Trang chủ</a>
            <a href="#">Sản phẩm</a>
            <a href="#">Khuyến mãi</a>
            <a href="#">Liên hệ</a>
        </nav>
    </header>

    <!-- 搜索框 -->
    <div class="search-bar">
        <input type="text" placeholder="Tìm kiếm sản phẩm...">
        <button>Tìm kiếm</button>
    </div>

    <!-- 商品展示区 -->
    <div class="store">
        <!-- 商品 1 -->
        <div class="product">
            <img src="https://via.placeholder.com/220x180" alt="Sản phẩm 1">
            <div class="title">Sản phẩm 1</div>
            <div class="price">Giá: $29.99</div>
            <div class="description">Mô tả ngắn gọn về sản phẩm 1.</div>
            <a href="https://www.amazon.com/dp/example1?tag=your-affiliate-id" target="_blank" class="buy-btn">Mua ngay</a>
        </div>
        <!-- 商品 2 -->
        <div class="product">
            <img src="https://via.placeholder.com/220x180" alt="Sản phẩm 2">
            <div class="title">Sản phẩm 2</div>
            <div class="price">Giá: $49.99</div>
            <div class="description">Mô tả ngắn gọn về sản phẩm 2.</div>
            <a href="https://www.amazon.com/dp/example2?tag=your-affiliate-id" target="_blank" class="buy-btn">Mua ngay</a>
        </div>
        <!-- 商品 3 -->
        <div class="product">
            <img src="https://via.placeholder.com/220x180" alt="Sản phẩm 3">
            <div class="title">Sản phẩm 3</div>
            <div class="price">Giá: $99.99</div>
            <div class="description">Mô tả ngắn gọn về sản phẩm 3.</div>
            <a href="https://www.amazon.com/dp/example3?tag=your-affiliate-id" target="_blank" class="buy-btn">Mua ngay</a>
        </div>
    </div>

    <!-- 页脚 -->
    <footer>
        © 2026 TrustNet Affiliate Mall - Powered by GitHub Pages
    </footer>
</body>
</html>
