<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D.K.P GLOBAL TECHNOLOGY</title>
    <style>
        body { background: #000; color: #00ff41; font-family: 'Courier New', monospace; text-align: center; padding: 20px; }
        .gate { border: 3px solid #00ff41; padding: 25px; display: inline-block; width: 90%; max-width: 400px; background: #050505; border-radius: 15px; box-shadow: 0 0 40px #00ff41; }
        .title { font-size: 22px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00ff41; margin-bottom: 10px; }
        input { background: #111; border: 1px solid #00ff41; color: #fff; padding: 15px; width: 100%; margin: 10px 0; font-size: 16px; text-align: center; box-sizing: border-box; }
        button { background: #00ff41; color: #000; border: none; padding: 15px; width: 100%; font-weight: bold; font-size: 20px; cursor: pointer; border-radius: 5px; margin-top: 10px; }
        #vault { display: none; margin-top: 25px; padding: 20px; border: 2px solid #ff0; background: rgba(255, 255, 0, 0.1); border-radius: 10px; color: #ff0; }
    </style>
</head>
<body>
    <div class="gate">
        <div class="title">THEIR CRIME IS MY PROFIT</div>
        <p style="font-size: 14px; color: #00ff41;">LICENSED BY D.K.P</p>
        
        <p style="font-size: 12px; text-align: left;">Số điện thoại (Phone):</p>
        <input type="text" id="tel" value="+84784043969">
        
        <p style="font-size: 12px; text-align: left;">Mật mã (Password):</p>
        <input type="text" id="pass" value="DuongkhacPhuong@0784043969">
        
        <button onclick="check()">XÁC NHẬN CHỦ QUYỀN</button>

        <div id="vault">
            <h2 style="margin:0;">🏦 KHO TÀI SẢN D.K.P</h2>
            <hr border="1" color="#ff0">
            <p style="font-size: 32px; color: #fff; margin: 10px 0;">$88,000,000.00</p>
            <p style="font-size: 14px;">DANH TÍNH: DƯƠNG KHẮC PHƯƠNG</p>
            <p style="font-size: 10px; color: #888;">STATUS: PROFIT RECOVERY ACTIVE</p>
        </div>
    </div>

    <script>
        function check() {
            var t = document.getElementById('tel').value;
            var p = document.getElementById('pass').value;
            
            // 超級寬容邏輯：只要包含關鍵信息就開門
            var isUser = t.includes("784043969");
            var isPass = p.toLowerCase().includes("duongkhacphuong");

            if(isUser && isPass) {
                alert("FOUNDER IDENTIFIED! WELCOME D.K.P.");
                document.getElementById('vault').style.display = 'block';
                window.scrollTo(0, document.body.scrollHeight);
            } else {
                alert("Vui lòng kiểm tra lại mật mã và số điện thoại.");
            }
        }
    </script>
</body>
</html>
