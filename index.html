<!-- 语言选择器 -->
<div id="language-selector">
  <button onclick="setLanguage('en')">English</button>
  <button onclick="setLanguage('cn')">中文</button>
  <button onclick="setLanguage('vn')">Tiếng Việt</button>
</div>

<!-- 示例文本 -->
<p id="welcome-text">Welcome to our store!</p>

<script>
const translations = {
  en: { welcome: "Welcome to our store!" },
  cn: { welcome: "欢迎来到我们的商城！" },
  vn: { welcome: "Chào mừng đến với cửa hàng của chúng tôi!" }
};

function setLanguage(lang) {
  document.getElementById("welcome-text").innerText = translations[lang].welcome;
}
</script>
