
<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>TrustNet 密码保护页面</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 100px;
      background-color: #f0f8ff;
    }
    input {
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      margin-left: 10px;
      background-color: #3498db;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2980b9;
    }
    #content {
      display: none;
      margin-top: 50px;
    }
    #lockMessage {
      color: red;
      font-weight: bold;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <!-- 密码输入区域 -->
  <h2>请输入密码进入页面</h2>
  <input type="password" id="password" placeholder="输入密码">
  <button onclick="checkPassword()">进入</button>
  <div id="lockMessage"></div>

  <!-- 页面内容区域（默认隐藏） -->
  <div id="content">
    <h1>欢迎来到 TrustNet</h1>
    <p>这是受密码保护的内容，只有输入正确密码才能看到。</p>
    <button onclick="window.location.href='https://github.com/diulewinphuong-cloud/trustnet'">
      前往 GitHub 仓库
    </button>
  </div>

  <script>
    let attempts = 0; // 错误次数计数
    const maxAttempts = 3; // 最大允许错误次数
    const correctPassword = "Duongkhacphuong0784043969"; // 你的密码

    function checkPassword() {
      const input = document.getElementById("password").value;
      const lockMessage = document.getElementById("lockMessage");

        lockMessage.innerText = "您已连续输错三次，页面已锁定！请刷新页面后再试。";
        return;
