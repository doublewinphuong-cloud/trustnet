<!DOCTYPE html>

        .license-info { text-align: left; background: #111; padding: 15px; border-left: 5px solid #00ff41; margin: 20px 0; }
        .btn-verify { background: #00ff41; color: #000; border: none; padding: 15px; width: 80%; font-weight: bold; font-size: 18px; border-radius: 5px; cursor: pointer; }
        .footer { margin-top: 40px; font-size: 11px; color: #555; border-top: 1px solid #222; padding-top: 15px; }
        #auth-content { display: none; margin-top: 20px; color: #ff0; border: 1px dashed #ff0; padding: 15px; }

<body>
    <div class="box">

    <script>
        function verifyAccess() {
            // 執行純淨的身份驗證，不涉及任何無關系統
            let phone = prompt("請輸入您的手機號碼 (例如 +84...):");
