<!-- CSS -->
<style>
nav ul {

  padding: 0;

nav ul li {
  position: relative;
  margin-right: 20px;
}

nav ul li a {
  text-decoration: none;

}

nav ul li .dropdown {

  background: #f9f9f9;

nav ul li:hover .dropdown {

}

/* 手机端样式 */

  nav ul {
    display: none;
    flex-direction: column;
  }
  nav ul.show {
    display: flex;
  }
  .menu-toggle {
    background: #333;
    color: #fff;
    padding: 10px;
    cursor: pointer;
  }
}
</style>

<!-- JS 控制展开收起 -->
